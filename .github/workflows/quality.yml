name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer quality
      - run: node --check assets/js/admin.js
      - run: node --check assets/js/frontend.js

  package:
    runs-on: ubuntu-latest
    needs: php
    steps:
      - uses: actions/checkout@v4
      - name: Build distribution ZIP
        run: |
          distribution_dir="${RUNNER_TEMP}/tomawesome-review-widgets"
          mkdir -p "${distribution_dir}"
          rsync -rc --exclude-from=.distignore ./ "${distribution_dir}/"
          cd "${RUNNER_TEMP}"
          zip -qr "${GITHUB_WORKSPACE}/tomawesome-review-widgets.zip" tomawesome-review-widgets
      - uses: actions/upload-artifact@v4
        with:
          name: tomawesome-review-widgets
          path: tomawesome-review-widgets.zip
