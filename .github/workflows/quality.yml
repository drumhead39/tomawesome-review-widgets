name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer quality
      - run: node --check assets/js/admin.js
      - run: node --check assets/js/frontend.js

  package:
    runs-on: ubuntu-latest
    needs: php
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --prefix=tomawesome-review-widgets/ --output=tomawesome-review-widgets.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: tomawesome-review-widgets
          path: tomawesome-review-widgets.zip
